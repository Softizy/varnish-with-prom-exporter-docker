name: Build & Push branches
on:
  push:
    branches:
      - 'develop'
    tags:
      - '*'
  pull_request:
    branches:
      - 'develop'
jobs:
  publication-contract:
    name: Validate publication contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Ensure GHCR publication cannot be blocked by legacy registry credentials
        run: tests/assert-publication-contract.sh

  test-platforms:
    name: Test ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
          - platform: linux/arm64
            tag: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: varnish-exporter-test:${{ matrix.tag }}
      - name: Execute the exporter on its target architecture
        run: |
          docker run --rm \
            --platform '${{ matrix.platform }}' \
            --entrypoint /usr/sbin/prometheus_varnish_exporter \
            'varnish-exporter-test:${{ matrix.tag }}' \
            -version

  docker:
    needs:
      - publication-contract
      - test-platforms
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/softizy/varnish-with-prom-exporter-docker
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
